receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  # Claude Code esporta contatori delta; l'exporter Prometheus accetta solo cumulativi.
  # Senza questo processor token_usage e cost_usage non compaiono.
  deltatocumulative: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion: {enabled: true}
  debug: {verbosity: basic}

service:
  pipelines:
    metrics: {receivers: [otlp], processors: [deltatocumulative], exporters: [prometheus, debug]}
    logs: {receivers: [otlp], exporters: [debug]}
